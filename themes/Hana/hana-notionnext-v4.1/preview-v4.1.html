/* Route content is a named transition region. At desktop widths the four actual
   widgets share names between the dashboard and sidebar, so their positions morph. */
#main{view-transition-name:page-content}
@media(min-width:1121px){
 .home-calendar,#rightbar>.calendar{view-transition-name:widget-calendar}
 .home-categories,#rightbar>.side-categories{view-transition-name:widget-categories}
 .home-tools,#rightbar>.side-tools{view-transition-name:widget-tools}
 .home-ai,#rightbar>.side-ai{view-transition-name:widget-ai}
}
::view-transition-old(root){animation:none;opacity:0}
::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-group(page-content){animation-duration:.48s;animation-timing-function:var(--route-ease)}
::view-transition-old(page-content),::view-transition-new(page-content){mix-blend-mode:normal;height:auto;object-fit:contain;object-position:top center}
::view-transition-old(page-content){animation:hana-page-out .22s cubic-bezier(.4,0,.8,.8) both}
::view-transition-new(page-content){animation:hana-page-in .43s var(--route-ease) .045s both}
::view-transition-group(widget-calendar),::view-transition-group(widget-categories),::view-transition-group(widget-tools),::view-transition-group(widget-ai){animation-duration:.54s;animation-timing-function:var(--route-ease);overflow:hidden;border-radius:20px}
::view-transition-old(widget-calendar),::view-transition-old(widget-categories),::view-transition-old(widget-tools),::view-transition-old(widget-ai){mix-blend-mode:normal;animation:hana-widget-out .27s ease both;object-fit:cover;object-position:top left}
::view-transition-new(widget-calendar),::view-transition-new(widget-categories),::view-transition-new(widget-tools),::view-transition-new(widget-ai){mix-blend-mode:normal;animation:hana-widget-in .43s var(--route-ease) .075s both;object-fit:cover;object-position:top left}
@keyframes hana-page-out{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(var(--exit-x)) translateY(-4px);filter:blur(2px)}}
@keyframes hana-page-in{from{opacity:0;transform:translateX(var(--enter-x)) translateY(9px);filter:blur(3px)}to{opacity:1;transform:translate(0,0);filter:blur(0)}}
@keyframes hana-widget-out{from{opacity:1}to{opacity:0}}
@keyframes hana-widget-in{from{opacity:0}to{opacity:1}}
@keyframes hana-stagger{from{opacity:0;transform:translateY(13px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}

@keyframes hana-breathe{0%,100%{transform:scale(.97)}50%{transform:scale(1.03)}}

{id:'a1',title:'把日子过成喜欢的样子',date:'2026-11-26',cat:'生活手账',tags:['日常','生活'],minutes:3,art:'tea',summary:'冬日午后的光、热茶与尚未写完的手账。记录一点缓慢而有温度的日常。',body:['今天的窗边有很好的阳光。我泡了一杯热茶，打开很久没有翻过的手账，把最近发生的小事一一写下来。','不必每一天都过得很精彩。记下一顿好吃的早餐、路边新开的花、一首反复播放的歌，也是一种认真生活的方式。','给未来的自己留一点空白吧。慢慢走，慢慢看，把喜欢的东西留下来。']},

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('hana-background',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function storeBG(blob){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction('files','readwrite');const s=t.objectStore('files');blob?s.put(blob,'background'):s.delete('background');t.oncomplete=()=>{db.close();res()};t.onerror=()=>{db.close();rej(t.error)}})}
async function readBG(){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('files').objectStore('files').get('background');r.onsuccess=()=>{db.close();res(r.result)};r.onerror=()=>{db.close();rej(r.error)}})}
function setBGBlob(blob){if(bgObjectURL)URL.revokeObjectURL(bgObjectURL);bgBlob=blob;bgObjectURL=blob?URL.createObjectURL(blob):null;}

// Route transitions: shared-element morphs where supported, an accessible stagger fallback otherwise.
let activeViewTransition=null;
const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function routeIndex(route){return NAV.findIndex(n=>n[0]===(route==='article'?'blog':route))}
function staggerEnter(){
 if(reducedMotion())return;
 const main=$('#main');
 main.classList.remove('route-enter');
 Array.from(main.children).forEach((el,i)=>el.style.setProperty('--stagger',String(Math.min(i,5))));
 main.querySelectorAll('.home-dashboard > *').forEach((el,i)=>el.style.setProperty('--stagger',String(i+2)));
 void main.offsetWidth;main.classList.add('route-enter');
}
function changeRoute(){
 const next=(location.hash.slice(1)||'home').split('/')[0];
 const direction=routeIndex(next)<routeIndex(currentRoute)?'back':'forward';
 document.documentElement.dataset.navDirection=direction;
 const update=()=>{render();window.scrollTo({top:0,left:0,behavior:'instant'})};
 if(reducedMotion()){update();return}
 if(typeof document.startViewTransition==='function'&&document.visibilityState==='visible'){
  if(activeViewTransition)activeViewTransition.skipTransition();
  const transition=document.startViewTransition(update);
  activeViewTransition=transition;
  transition.finished.catch(()=>{}).finally(()=>{if(activeViewTransition===transition)activeViewTransition=null});
 }else{update();staggerEnter()}
}
window.addEventListener('hashchange',changeRoute);

  progress.textContent='正在载入 WebLLM…';
  const webllm=await import('https://esm.run/@mlc-ai/web-llm@0.2.89');
  engine=await webllm.CreateMLCEngine(MODEL,{initProgressCallback:r=>{$('#modelProgress').style.width=`${Math.round((r.progress||0)*100)}%`;progress.textContent=r.text||'正在准备模型…'}});
  $('#aiSubtitle').textContent='本地 AI 已就绪';$('#modelProgress').style.width='100%';progress.textContent='已启用。AI 回答可能不准确。';button.textContent='已启用';addBubble('我准备好啦。你可以问我关于本站文章和工具的问题。','assistant');
 }catch(err){engine=null;button.disabled=false;button.textContent='重试加载';$('#aiSubtitle').textContent='加载失败 · 可重试';progress.textContent='加载失败：'+String(err.message||err).slice(0,250)+'。请检查网络、浏览器 WebGPU 支持和可用内存。'}finally{modelLoading=false}
});
function siteContext(){
 const context=POSTS.map(p=>`${p.title}（${p.cat}）：${p.summary}`).join('\n');
 const article=currentPost?`\n正在阅读：${currentPost.title}\n${currentPost.body.join('\n')}`:'\n当前没有打开文章。';
 return `你是花笺个人博客的中文助手 Hana。回答简洁友好。根据以下示例站点内容回答，不要编造未提供的文章或网站。不知道就说明。你不是联网搜索工具。\n文章：\n${context}\n工具：\n${tools().map(t=>`${t.name}：${t.desc||'收藏工具'}`).join('\n')}${article}`.slice(0,3600)
}
$('#aiForm').addEventListener('submit',async e=>{
 e.preventDefault();const input=$('#aiInput'),text=input.value.trim();if(!text||aiBusy)return;
 if(!engine){toast('请先启用本地 AI 模型');$('#aiProgress').textContent=modelLoading?'模型正在初始化，请加载完成后再发送。':'请先点击“启用本地 AI”。';return}
 aiBusy=true;$('#sendAI').disabled=true;input.value='';addBubble(text,'user');const response=addBubble('正在生成…','assistant');
 try{
  const messages=[{role:'system',content:siteContext()},...historyAI.slice(-4),{role:'user',content:text}];
  const stream=await engine.chat.completions.create({messages,temperature:.5,max_tokens:320,stream:true});
  let answer='';for await(const part of stream){answer+=part.choices?.[0]?.delta?.content||'';response.textContent=answer||'正在生成…';$('#messages').scrollTop=$('#messages').scrollHeight}
  response.textContent=answer||'这次没有生成内容，请换一个问题。';if(answer){historyAI.push({role:'user',content:text},{role:'assistant',content:answer});historyAI=historyAI.slice(-6)}
 }catch(err){response.textContent='生成失败：'+String(err.message||err).slice(0,160)+'。请缩短问题或重新加载页面。'}finally{aiBusy=false;$('#sendAI').disabled=false}
});
$('#aiInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#aiForm').requestSubmit()}});
applyPrefs();render();staggerEnter();if(prefs.bg==='custom')readBG().then(blob=>{if(blob){setBGBlob(blob);applyPrefs()}else{prefs.bg='sakura';setPrefs()}}).catch(()=>{prefs.bg='sakura';setPrefs()});
</script>
</body>
</html>
